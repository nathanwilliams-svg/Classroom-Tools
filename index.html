<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a71930">
<title>Nipher Classroom Tools</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24262b;background:#f7f7f9}
*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#891328,#b71e38);color:white;padding:42px max(24px,calc((100vw - 1120px)/2));}
header .eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.14em;opacity:.85}h1{font-size:clamp(2rem,5vw,3.4rem);margin:.35em 0 .15em}header p{margin:0;opacity:.92;font-size:1.06rem}
main{max-width:1120px;margin:auto;padding:32px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}.top h2{margin:0;font-size:1.4rem}input{width:min(100%,360px);padding:13px 16px;border:1px solid #c9cbd1;border-radius:12px;font:inherit;background:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-height:190px;padding:22px;border:1px solid #e4e4e9;border-radius:18px;background:white;box-shadow:0 5px 20px rgba(25,29,42,.04);transition:transform .15s,border-color .15s,box-shadow .15s}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#b71e38;box-shadow:0 12px 28px rgba(25,29,42,.1)}.symbol{font-size:2rem}.name{font-size:1.12rem;font-weight:750;line-height:1.35;margin:15px 0 12px}.open{margin-top:auto;color:#aa1731;font-size:.92rem;font-weight:700}.note{font-size:.9rem;color:#62656f;margin-top:20px;line-height:1.6}footer{max-width:1120px;margin:auto;padding:0 24px 30px;color:#757983;font-size:.83rem}.empty{padding:25px;background:white;border-radius:12px}a:focus-visible,input:focus-visible{outline:3px solid #f29baa;outline-offset:2px}
</style>
</head>
<body>
<header><div class="eyebrow">NIPHER • CLASSROOM RESOURCES</div><h1>Classroom Tools</h1><p>One place for your teaching tools, games, and classroom resources.</p></header>
<main><div class="top"><h2>My classroom tools <span id="count" aria-live="polite"></span></h2><input id="search" type="search" placeholder="Search classroom tools…" aria-label="Search classroom tools"></div><section class="grid" id="tools" aria-live="polite"></section><p class="note" id="status">Loading your tools…</p></main>
<footer>Created for Nipher classrooms • New HTML files added to this GitHub repository appear here automatically.</footer>
<script>
(function(){
"use strict";
const owner="nathanwilliams-svg", repo="Classroom-Tools";
const fallback=[
"Class Bank Bonus Wheel.html",
"Mr. Williams’ Seating Chart Maker.html",
"Rubrics.html",
"Screwdriver Groups.html"
];
const grid=document.getElementById("tools"),search=document.getElementById("search"),count=document.getElementById("count"),status=document.getElementById("status");
let names=fallback;
function label(name){return name.replace(/\.html?$/i,"").replace(/[_-]+/g," ").trim()}
function emoji(name){const s=name.toLowerCase();if(s.includes("wheel"))return "🎡";if(s.includes("expo"))return "🛠️";if(s.includes("seat"))return "🪑";if(s.includes("rubric"))return "📋";if(s.includes("screwdriver"))return "🔧";if(s.includes("robot"))return "🤖";if(s.includes("medical")||s.includes("brain"))return "🧠";if(s.includes("science"))return "🔬";return "📚"}
function render(){
const q=search.value.trim().toLowerCase();
const filtered=names.filter(n=>label(n).toLowerCase().includes(q));
grid.replaceChildren();
for(const name of filtered){
const a=document.createElement("a");a.className="card";
a.href="./"+encodeURIComponent(name);
const symbol=document.createElement("div");symbol.className="symbol";symbol.textContent=emoji(name);
const title=document.createElement("div");title.className="name";title.textContent=label(name);
const open=document.createElement("div");open.className="open";open.textContent="Open tool →";
a.append(symbol,title,open);grid.append(a);
}
count.textContent="("+filtered.length+")";
if(!filtered.length){const div=document.createElement("p");div.className="empty";div.textContent="No tools match your search.";grid.append(div)}
}
search.addEventListener("input",render);
render();
fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents/?ref=main",{headers:{"Accept":"application/vnd.github+json"}})
.then(r=>{if(!r.ok)throw Error("Unable to load repository listing");return r.json()})
.then(data=>{
if(!Array.isArray(data))throw Error("Unexpected listing");
const found=data.filter(x=>x.type==="file"&&/\.html?$/i.test(x.name)&&x.name.toLowerCase()!=="index.html").map(x=>x.name);
if(found.length){names=found.sort((a,b)=>a.localeCompare(b));render();status.textContent="All HTML tools in your repository are shown here. Add another HTML file and it will appear automatically."}
else status.textContent="No additional HTML tools found in the repository yet.";
})
.catch(()=>{status.textContent="Showing verified classroom tools. If any newer tools are missing, refresh the page or check your internet connection."});
})();
</script>
</body></html>
